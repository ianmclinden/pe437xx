[package]
name = "example-spi-async"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
dummy-pin = "1.0.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-stm32 = { version = "0.6.0", features = [
    "stm32f103c8",
    "unstable-pac",
    "memory-x",
    "time-driver-any",
    "exti",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
panic-halt = "1.0.0"
pe437xx = { path = "../../../pe437xx", features = ["async"] }

[profile.release]
lto = true
