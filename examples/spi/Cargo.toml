[package]
name = "example-spi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
dummy-pin = "1.0.0"
embedded-hal-bus = "0.3.0"
panic-halt = "1.0.0"
stm32f1xx-hal = { version = "0.11.0", features = ["stm32f103", "medium"] }
pe437xx = { path = "../../../pe437xx" }

[profile.release]
lto = true
